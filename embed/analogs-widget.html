<!doctype html>
<meta charset="utf-8">
<title>Lartek — вкладка «Аналоги»</title>
<!--
  ЯК ПРАЦЮЄ (так само, як вкладка «Сумісні моделі»)
  1) У Horoshop на товарі створюється вкладка з назвою «Аналоги»
     (або «Заміна товару» / «Замена товара») — вміст вкладки будь-який,
     він буде замінений.
  2) Цей скрипт (його автоматично підвантажує наявний widget.js — окремий
     рядок у Horoshop додавати НЕ потрібно):
     - знаходить вкладку «Аналоги» на сторінці;
     - бере артикул товару з meta[itemprop=sku];
     - питає models-api /api/analogs?sku=… (аналоги = товари, сумісні з тими
       самими моделями: мін. 3 спільні; лише та сама категорія);
     - картки товарів (назва, фото, ціна, наявність) бере з models-api
       /api/cards — БЕЗ звернень до пошуку з боку сайту;
     - малює список у вкладці. Якщо аналогів немає — ховає вкладку.
  3) Якщо вкладки немає, але в описі товару є <div class="lartek-analogs-mount">
     — малює у ньому (ручне розміщення).

  Роздача: GET /analogs.js (server.js бере вміст тегу скрипта і підставляє
  var API='' → адресу сервера). Тут звичайний JS, без шаблонних рядків.
-->
<script>
(function(){
  if (window.__laBooted) return; window.__laBooted = 1;
  var API='';
  var SHOW=4;      // скільки карток показувати одразу
  var FETCH=12;    // скільки кандидатів перевіряти

  var isRu=/^\/ru(\/|$)/.test(location.pathname);
  var T=isRu
    ? {code:'Код: ', ok:'В наличии', off:'Нет в наличии', more:'Показать ещё', empty:'Аналоги для этого товара пока не добавлены.',
       tglTitle:function(n){return 'Есть '+n+' '+plural(n,'аналог','аналога','аналогов');}, tglFrom:'от ',
       price:function(p){return p?fmt(p)+' грн':'цена по запросу';}}
    : {code:'Код: ', ok:'В наявності', off:'Немає в наявності', more:'Показати ще', empty:'Аналоги для цього товару поки не додані.',
       tglTitle:function(n){return 'Є '+n+' '+plural(n,'аналог','аналоги','аналогів');}, tglFrom:'від ',
       price:function(p){return p?fmt(p)+' грн':'ціна за запитом';}};
  function plural(n,one,few,many){
    var m10=n%10,m100=n%100;
    if(m10===1&&m100!==11) return one;
    if(m10>=2&&m10<=4&&(m100<12||m100>14)) return few;
    return many;
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fmt(n){ return Math.round(n).toLocaleString('uk-UA'); }
  function thumb(url,px){ if(!url) return ''; return 'https://wsrv.nl/?url='+encodeURIComponent(url)+'&w='+px+'&h='+px+'&fit=inside&output=webp'; }
  function metaSku(){ var m=document.querySelector('meta[itemprop="sku"]'); return m?String(m.getAttribute('content')||'').trim():''; }
  function norm2(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }

  // ── запобіжники для АВТО-аналогів (ручних не стосуються) ──
  // Товари підходять до тих самих моделей, але різні за суттю, якщо в назвах
  // різний обʼєм (чаша 500мл ≠ 350мл) або різний розмір (сальник 25*47*8 ≠ 30*52*10).
  function volOf(name){
    var s=String(name||'').toLowerCase().replace(/,/g,'.');
    var m=s.match(/(\d+(?:\.\d+)?) ?(?:мл|ml)(?![a-zа-яіїє])/);
    if(m) return parseFloat(m[1]);
    m=s.match(/(\d+(?:\.\d+)?) ?(?:л|l)(?![a-zа-яіїє0-9])/);
    if(m) return parseFloat(m[1])*1000;
    return null;
  }
  function dimOf(name){
    var m=String(name||'').match(/\d+(?:[.,]\d+)?(?:[ ]?[*xх×][ ]?\d+(?:[.,]\d+)?)+(?:[ ]?\/[ ]?\d+(?:[.,]\d+)?)?/i);
    return m?m[0].toLowerCase().replace(/,/g,'.').replace(/[ ]/g,'').replace(/[xх×]/g,'*'):null;
  }
  // Код деталі у назві (напр. підшипник 6202/6203/6204): пралка має ОБИДВА
  // підшипники, моделі спільні, але 6203 ≠ 6204 — не взаємозамінні. Беремо
  // окремі 4-значні коди 3000–6999 (потужність 1600W/2000W і роки сюди не
  // потрапляють). Суфікси (6202-2RS ↔ 6202-2Z) не заважають — код той самий.
  function codesOf(name){
    var out={}, s=String(name||''), m,
        re=/(^|[^0-9a-zа-яёіїєґ])([3-6]\d{3})(?=$|[^0-9])/gi;
    while((m=re.exec(s))) out[m[2]]=1;
    return Object.keys(out);
  }
  function conflicting(curName,name){
    var v1=volOf(curName), v2=volOf(name);
    if(v1!=null&&v2!=null&&Math.abs(v1-v2)>0.5) return true;
    var d1=dimOf(curName), d2=dimOf(name);
    if(d1&&d2&&d1!==d2) return true;
    var c1=codesOf(curName), c2=codesOf(name);
    if(c1.length&&c2.length&&!c1.some(function(x){return c2.indexOf(x)>=0;})) return true;
    return false;
  }

  // ── пошук вкладки «Аналоги» (той самий принцип, що вкладка «Сумісні моделі») ──
  var TT=['аналоги','аналоги товару','аналоги товара','заміна товару','замена товара','аналоги / заміна товару','аналоги / замена товара','посмотреть замену товара','подивитись заміну товару'];
  function findTab(){
    var tabs=document.querySelectorAll('.product-heading__tab, [class*="heading__tab"]');
    for(var i=0;i<tabs.length;i++){
      var tt=norm2(tabs[i].textContent);
      if(TT.indexOf(tt)>=0){
        var id=(tabs[i].getAttribute('href')||'').replace(/^#/,'');
        if(id){ var b=document.querySelector('[data-content-id="'+id+'"]')||document.getElementById(id);
          if(b) return {panel:b, tab:tabs[i]}; }
      }
    }
    var bl=document.querySelectorAll('[data-content-id], .j-product-block__tab, .product__section');
    for(var j=0;j<bl.length;j++){
      var tx=norm2(bl[j].textContent).slice(0,60);
      if(/^аналог|^зам[іе]н|^посмотреть замену|^подивитись заміну/.test(tx)) return {panel:bl[j], tab:null};
    }
    return null;
  }
  function hideTab(f){
    if(f.tab) f.tab.style.display='none';
    if(f.panel) f.panel.style.display='none';
  }

  // Мобільний шаблон Horoshop НЕ рендерить кастомні вкладки (немає жодного
  // .product-heading__tab). Тоді створюємо ВЛАСНИЙ блок «Аналоги» у стилі
  // мобільної теми — одразу після блоку «Сумісні моделі» (або після опису).
  // Блок вставляється лише при render(), тож без аналогів нічого не з'являється.
  function insertOwnBlock(mount,list){
    var sec=document.createElement('div'); sec.className='product__block la-block';
    // Заголовок-«кнопка», зрозумілий покупцю: іконка, назва з кількістю, пояснення,
    // міні-фото товарів усередині і стрілка. За замовчуванням ЗГОРНУТО.
    var hd=document.createElement('div'); hd.className='la-tgl';
    // стек фото внахлест (до 3) + «+N»
    var thumbs='',shown=0;
    for(var i=0;i<list.length&&shown<3;i++){
      var p=list[i].h&&list[i].h.picture; if(!p) continue;
      thumbs+='<img class="la-stk" loading="lazy" src="'+thumb(p,88)+'" alt="">'; shown++;
    }
    var extra=list.length-shown;
    if(extra>0) thumbs+='<span class="la-stk la-stk-more">+'+extra+'</span>';
    // «від X грн» — мінімальна ціна серед аналогів
    var minP=0;
    for(var j=0;j<list.length;j++){ var pr=list[j].h&&list[j].h.price; if(pr&&(!minP||pr<minP)) minP=pr; }
    hd.innerHTML=(thumbs?('<span class="la-stack">'+thumbs+'</span>'):'')
      +'<span class="la-tgl-mid"><span class="la-tgl-t">'+T.tglTitle(list.length)+'</span>'
      +(minP?('<span class="la-tgl-p">'+T.tglFrom+fmt(minP)+' грн</span>'):'')
      +'</span><span class="la-arr">&#9662;</span>';
    var inner=document.createElement('div'); inner.style.display='none';
    inner.appendChild(mount);
    hd.onclick=function(){
      var open=inner.style.display!=='none';
      inner.style.display=open?'none':'';
      hd.classList.toggle('la-open',!open);
      var a=hd.querySelector('.la-arr'); if(a) a.innerHTML=open?'&#9662;':'&#9652;';
    };
    sec.appendChild(hd); sec.appendChild(inner);
    // Десктоп без вкладки «Аналоги»: блок одразу ПІД секцією вкладок. Розкладок
    // може бути кілька (дублі під різну ширину) — беремо видиму (offsetParent).
    var navs=document.querySelectorAll('.product-heading__nav'), nav=null;
    for(var n=0;n<navs.length;n++){ if(navs[n].offsetParent!==null){ nav=navs[n]; break; } }
    if(!nav&&navs.length) nav=navs[0];
    if(nav&&nav.closest){
      var g=nav.closest('.product__group--tabs')||nav.closest('.product__group');
      if(g&&g.parentNode){ g.parentNode.insertBefore(sec,g.nextSibling); return true; }
    }
    var cm=document.querySelector('.lartek-compat-mount');
    var host=cm&&cm.closest&&cm.closest('.product__block');
    if(host&&host.parentNode){ host.parentNode.insertBefore(sec,host.nextSibling); return true; }
    var d=document.querySelector('[itemprop="description"], .product-description');
    var hb=d&&((d.closest&&(d.closest('.product__block')||d.closest('.product-description')))||d);
    if(hb&&hb.parentNode){ hb.parentNode.insertBefore(sec,hb.nextSibling); return true; }
    return false;
  }
  function connected(el){ return el.isConnected!==undefined?el.isConnected:document.documentElement.contains(el); }

  // ── запуск ──
  function boot(){
    var mount=document.querySelector('.lartek-analogs-mount'), found=null;
    if(!mount){
      found=findTab();
      if(found){
        mount=document.createElement('div');
        found.panel.innerHTML=''; found.panel.appendChild(mount);
      } else {
        // Вкладки є, але вкладки «Аналоги» немає (десктоп без ручної вкладки) —
        // або вкладок немає взагалі (мобільний шаблон). В обох випадках власний
        // блок вставиться лише при render(), тож без аналогів сторінка чиста.
        mount=document.createElement('div');
      }
    }
    var sku=metaSku();
    if(!sku){ if(found) hideTab(found); return; }
    fetch(API+'/api/analogs?sku='+encodeURIComponent(sku))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var items=(d&&d.items)||[];
        if(!items.length){ noData(mount,found); return; }
        var cand=items.slice(0,FETCH);
        var skus=[sku].concat(cand.map(function(it){ return it.sku; }));
        return fetch(API+'/api/cards?skus='+encodeURIComponent(skus.join(',')))
          .then(function(r){ return r.json(); })
          .then(function(cd){
            var cards={}; ((cd&&cd.cards)||[]).forEach(function(c){ cards[String(c.sku)]=c; });
            var cur=cards[String(sku)];
            var man=[],auto=[];
            cand.forEach(function(it){
              var h=cards[String(it.sku)]; if(!h) return;
              if(cur&&cur.url&&h.url&&h.url===cur.url) return;                      // не сам товар
              if(it.manual){ man.push({h:h}); return; }                             // ручні — без фільтрів, як задав власник
              if(cur&&cur.category&&h.category&&h.category!==cur.category) return;  // авто — лише та сама категорія
              if(cur&&conflicting(cur.name,h.name)) return;                          // різний обʼєм/розмір у назві — не аналог
              auto.push({h:h,shared:it.shared});
            });
            if(!man.length&&!auto.length){ noData(mount,found); return; }
            auto.sort(function(a,b){ return (b.h.available?1:0)-(a.h.available?1:0) || b.shared-a.shared; });
            render(mount,man.concat(auto));
          });
      })
      .catch(function(){ noData(mount,found); });
  }
  function noData(mount,found){
    if(found){ hideTab(found); return; }          // рідну вкладку просто ховаємо
    if(!connected(mount)) return;                 // мобільний блок ще не вставлено — нічого не робимо
    // mount вставлено вручну У ВКЛАДКУ — знайдемо її і теж сховаємо, щоб не було пустої
    var f=findTab();
    if(f&&f.panel&&f.panel.contains(mount)){ hideTab(f); return; }
    mount.innerHTML='<div class="la-empty">'+T.empty+'</div>'; css();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();

  // ── вигляд ──
  function css(){
    if(document.getElementById('la-css')) return;
    var st=document.createElement('style'); st.id='la-css';
    st.textContent=''
      +'.la-wrap{font-family:Arial,Helvetica,sans-serif}'
      +'.la-block{margin:18px 0;font-family:Arial,Helvetica,sans-serif}'
      +'.la-tgl{display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;'
      +'border:1px solid #dfe3ea;border-radius:12px;padding:12px 14px;background:#fff;box-shadow:0 1px 3px rgba(15,30,60,.06)}'
      +'.la-tgl.la-open{border-radius:12px 12px 0 0}'
      +'.la-stack{display:flex;flex:0 0 auto}'
      +'.la-stk{width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:#fff;object-fit:contain;box-shadow:0 1px 3px rgba(0,0,0,.15)}'
      +'.la-stk+.la-stk{margin-left:-14px}'
      +'.la-stk-more{display:flex;align-items:center;justify-content:center;font-size:11px;color:#5b6b8c;background:#eef1f6}'
      +'.la-tgl-mid{flex:1;min-width:0;display:block}'
      +'.la-tgl-t{display:block;font-size:15px;font-weight:bold;color:#111}'
      +'.la-tgl-p{display:block;font-size:12.5px;color:#1d9d55;margin-top:2px;font-weight:bold}'
      +'.la-arr{font-size:16px;color:#8a94a6;flex:0 0 auto}'
      +'.la-tgl+div{border:1px solid #dfe3ea;border-top:none;border-radius:0 0 12px 12px;padding:12px 12px 4px;background:#fbfcfe}'
      +'.la-card{display:flex;gap:14px;align-items:center;border:1px solid #e6e9ee;border-radius:10px;padding:12px 14px;margin:0 0 10px;background:#fff}'
      +'.la-img{width:84px;height:84px;flex:0 0 84px;object-fit:contain;border-radius:6px;background:#fafafa}'
      +'.la-ph{width:84px;height:84px;flex:0 0 84px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#fafafa;color:#bbb}'
      +'.la-mid{flex:1;min-width:0}'
      +'.la-code{font-size:12px;color:#8a94a6;margin:0 0 3px}'
      +'.la-name{font-size:14px;line-height:1.35;color:#16408f;text-decoration:none;display:block;margin:0 0 5px;font-weight:bold}'
      +'.la-name:hover{text-decoration:underline}'
      +'.la-av{font-size:12px}.la-av.ok{color:#1d9d55}.la-av.off{color:#d92d20}'
      +'.la-price{flex:0 0 auto;font-size:15px;font-weight:bold;color:#111;background:#f4f6f9;border-radius:8px;padding:8px 12px;white-space:nowrap}'
      +'.la-off .la-name{color:#5b6b8c}.la-off .la-img{opacity:.55}'
      +'.la-more{display:block;width:100%;border:1px solid #d5dbe4;background:#fff;border-radius:8px;padding:9px;cursor:pointer;font-size:13px;color:#16408f}'
      +'.la-empty{font-size:13px;color:#8a94a6;padding:8px 0}'
      +'@media(max-width:520px){.la-img,.la-ph{width:64px;height:64px;flex-basis:64px}.la-price{font-size:14px;padding:6px 9px}}';
    document.head.appendChild(st);
  }
  function card(h){
    var img=h.picture?('<img class="la-img" loading="lazy" src="'+thumb(h.picture,168)+'" alt="" onerror="this.outerHTML=\'<div class=la-ph>—</div>\'">'):'<div class="la-ph">—</div>';
    var av=h.available?('<span class="la-av ok">'+T.ok+'</span>'):('<span class="la-av off">'+T.off+'</span>');
    return '<div class="la-card'+(h.available?'':' la-off')+'">'+img
      +'<div class="la-mid"><div class="la-code">'+T.code+esc(h.sku)+'</div>'
      +'<a class="la-name" href="'+esc(h.url||'#')+'">'+esc(h.name)+'</a>'+av+'</div>'
      +'<div class="la-price">'+T.price(h.price)+'</div></div>';
  }
  function render(mount,list){
    if(!connected(mount) && !insertOwnBlock(mount,list)) return; // мобільний шаблон без вкладок
    css();
    var html='<div class="la-wrap">';
    list.slice(0,SHOW).forEach(function(x){ html+=card(x.h); });
    if(list.length>SHOW) html+='<button type="button" class="la-more">'+T.more+' ('+(list.length-SHOW)+')</button>';
    html+='</div>';
    mount.innerHTML=html;
    var btn=mount.querySelector('.la-more');
    if(btn) btn.onclick=function(){
      var rest=''; list.slice(SHOW).forEach(function(x){ rest+=card(x.h); });
      var tmp=document.createElement('div'); tmp.innerHTML=rest;
      while(tmp.firstChild) btn.parentNode.insertBefore(tmp.firstChild,btn);
      btn.remove();
    };
  }
})();
</script>
